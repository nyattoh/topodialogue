[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topodialogue"
version = "0.1.0"
description = "Offline Phase-1 semantic recurrence detector for dialogue trajectories"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pydantic>=2.0", "networkx>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["topodialogue*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
